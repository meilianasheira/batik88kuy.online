    /* ── ROOT VARIABLES ── */
    :root {
      --gold:       #FFD700; /* Gold terang untuk aksen premium */

      --blue:       #F2C94C; /* Gold utama */

    /* ── RESET ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
    body {

      background: var(--dark);

    /* ── HERO BACKGROUND ── */

      position: fixed;
      inset: 0;
      z-index: 0;
      background:

    }
  
    .hero-bg-amp-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.18) grayscale(0.60) sepia(0.85) hue-rotate(355deg) saturate(1.50);
    }
  
    /* ── GRID SCANLINES ── */
    .scanlines {
      position: fixed;
      inset: 0;
      z-index: 1;
      background-image:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 3px,
          rgba(212, 175, 55, 0.03) 3px,
          rgba(212, 175, 55, 0.03) 4px

      pointer-events: none;
    }
  
    /* ── OVERLAY / CENTER ── */
    .overlay {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }
  
    /* ── CARD ── */
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--dark-card);
      border-radius: 16px;
      overflow: visible;
      position: relative;
      box-shadow: 
        /* Layer 1: Border glow gold yang terlihat */
        0 0 0 3px rgba(212, 175, 55, 0.6),
        /* Layer 2: Shadow inside - kesan carved in */
        inset 0 2px 8px rgba(212, 175, 55, 0.25),
        inset 0 -4px 10px rgba(0, 0, 0, 1),
        inset 2px 0 8px rgba(212, 175, 55, 0.15),
        inset -2px 0 8px rgba(0, 0, 0, 0.8),
        /* Layer 3: Outer depth shadows */
        0 15px 35px rgba(0, 0, 0, 0.95),
        0 25px 50px rgba(0, 0, 0, 0.85),
        0 -2px 8px rgba(212, 175, 55, 0.2);
      border: 2px solid rgba(212, 175, 55, 0.5);
    }

    .card::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 16px;
      background: linear-gradient(135deg,
        rgba(212, 175, 55, 0.2) 0%,
        transparent 50%,
        rgba(0, 0, 0, 0.4) 100%);
      pointer-events: none;
      z-index: -1;
    }
  
    /* ── TOPBAR ── */
    .topbar {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #1A1204 0%, #080603 100%);
      border-bottom: 1px solid var(--border);
      position: relative;
    }
  
    .topbar img {
      height: 50px;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 0 5px var(--blue));
    }
  
    /* ── BANNER ── */

      position: relative;
      overflow: hidden;
    }

    .label {
